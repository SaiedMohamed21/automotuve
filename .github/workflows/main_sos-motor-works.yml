name: Build and deploy SOS Motor Works to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Prepare ASP.NET Core wwwroot
        run: |
          mkdir -p "wwwroot"
          cp -R dist/. "wwwroot/"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore .NET dependencies
        run: dotnet restore "Engineer Job Order.csproj"

      - name: Build .NET
        run: dotnet build "Engineer Job Order.csproj" --configuration Release --no-restore

      - name: Publish .NET
        run: dotnet publish "Engineer Job Order.csproj" --configuration Release --no-build --output "${{ runner.temp }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sos-motor-works-app
          path: ${{ runner.temp }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: sos-motor-works-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AD5B155430374D04AC462C37450D360F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_374E73E2DB174AD9AE5E16FF2B306004 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5D6A790D3CAE441A8F71BDFAFC040CDA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sos-motor-works'
          slot-name: 'Production'
          package: ./publish
